# GENERATED by flowforge sync from site.config.js - edit that file, then run `npm run sync`.
# Hand edits here are drift and fail `npm run sync:check`.

title: flowforge
baseurl: "/flowforge" # the docs deploy path (GitHub Pages project path)
url: "https://docs.creadev.org"
description: The shell the struct family ships sites from: landing + docs rig + CI/release plumbing, with brand as data.

# Identity the layout renders (docs/_layouts/default.html reads these; the
# brand census gate keeps the layout from hardcoding any of them).
repo: https://github.com/dhaupin/flowforge
brand_accent: flow
brand_rest: forge
maker_label: Rook @ Creadev.org
maker_url: https://creadev.org
org_name: Creadev.org
org_url: https://creadev.org
site_url: https://flowforge.creadev.org
docs_url: https://docs.creadev.org/flowforge
theme_key: site-theme
scheme_key: site-paint-scheme

markdown: kramdown
highlighter: rouge
permalink: :title

# pretty = /path/ (with trailing slug); individual frontmatter overrides.
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

plugins:
  - jekyll-redirect-from
