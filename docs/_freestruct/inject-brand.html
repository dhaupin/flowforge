<!-- freestruct SEO template - flowforge shell edition.
     Trimmed-head contract (issue #3, freestruct 1.1.0): the Jekyll layout
     emits title + description ONLY, so this template now carries the WHOLE
     engine surface the layout dropped - canonical + the og:title /
     og:description / og:url / og:type / og:site_name set (per-page
     placeholders) - instead of being dupe-free against a baked head.
     og:image ships only when the config's og.image lands (documented
     adopter homework; the engine strips the line when empty). Our extras
     kept from the crashtest cut: the SoftwareApplication JSON-LD + the
     Organization author identity (the `{{siteAuthor}}` placeholder was
     never a supported substitution - see MANIFEST receipt).
     Placeholders honored: {{pageTitle}}, {{pageDescription}}, {{pageUrl}},
     {{canonicalUrl}}, {{siteUrl}}, {{siteName}}, {{siteDescription}},
     {{twitterCard}}, {{ogImageFull}}, {{ogType}}, {{ogLocale}}. -->

<meta name="description" content="{{pageDescription}}">
<link rel="canonical" href="{{canonicalUrl}}">

<!-- Open Graph -->
<meta property="og:title" content="{{pageTitle}}">
<meta property="og:description" content="{{pageDescription}}">
<meta property="og:url" content="{{pageUrl}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:image" content="{{ogImageFull}}">

<!-- Twitter -->
<meta name="twitter:card" content="{{twitterCard}}">
<meta name="twitter:title" content="{{pageTitle}}">
<meta name="twitter:description" content="{{pageDescription}}">

<!-- JSON-LD (SoftwareApplication shape from the crashtest cut; the
     Organization author identity rides config author data) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{siteName}}",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Node.js",
  "url": "{{siteUrl}}",
  "description": "{{siteDescription}}",
  "offers": { "@type": "Offer", "price": 0, "priceCurrency": "USD" },
  "author": { "@type": "Organization", "name": "{{siteName}}", "url": "{{siteUrl}}" }
}
</script>
