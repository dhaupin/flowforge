# Cloudflare Pages - the __NAME__ landing (__SITE_URL__)
# Deploy: CF Pages Git integration on this repo, or `npx wrangler pages deploy dist`
# from web/. The build output is web/dist (prestruct prerenders every route).
name = "__NAME__"
compatibility_date = "2026-10-23"
pages_build_output_dir = "dist"

[vars]
SITE_NAME = "__NAME__"

# Functions live in web/functions/ (Pages Functions = Workers under the hood).
# functions/api/health.js is the living proof the wire is connected; add more
# only when a real need shows.
